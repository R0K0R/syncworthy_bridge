[package]
name = "syncworthy_bridge"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "emacs-collab bridge for Syncworthy (Yjs over /yjs, presence over /ws/doc, files over REST)"

[dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
yrs = { version = "0.28.1", features = ["sync"] }
